name: Phase 2 security foundation

on:
  pull_request:
    paths:
      - "core/agents/**"
      - "core/api/v2/**"
      - "services/agent/**"
      - "services/reasoner/**"
      - "contracts/**"
      - "infra/database/init/41_managed_execution.sql"
      - "infra/helm/vigil/**"
      - "infra/phase2-lab/**"
      - "tests/unit/agents/**"
      - ".github/workflows/phase2-security.yml"
  workflow_dispatch:

jobs:
  contracts-and-python:
    name: Managed contracts and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Validate JSON contract
        run: python -m json.tool contracts/managed-execution.schema.json >/dev/null
      - name: Run managed security tests
        run: python -m pytest -q -o addopts='' tests/unit/agents/test_managed_execution.py tests/unit/agents/test_managed_bindings.py tests/unit/agents/test_reasoner_contract.py

  agent:
    name: Managed TypeScript adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/core/remote.test.ts tests/core/contracts.test.ts

  infrastructure:
    name: Pulumi and Helm lab validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test Pulumi lab program
        working-directory: infra/phase2-lab
        run: go test ./...
      - name: Lint Helm chart
        run: helm lint infra/helm/vigil
      - name: Render managed network policy
        run: helm template phase2 infra/helm/vigil --set networkPolicies.enabled=true --set networkPolicies.managedExecution=true >/tmp/vigil-phase2.yaml
