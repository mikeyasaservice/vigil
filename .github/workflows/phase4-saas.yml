name: Phase 4 shared SaaS checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-saas.yml"
      - "contracts/management-plane.openapi.yaml"
      - "contracts/postman/management-plane.collection.json"
      - "infra/management/**"
      - "infra/phase4-saas/**"
      - "scripts/generate_management_postman.py"
      - "services/management/**"
      - "tests/management/**"
  workflow_dispatch:

jobs:
  shared-control-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: phase4-ci
          POSTGRES_DB: vigil_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vigil_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PHASE3_TEST_DATABASE_URL: postgresql://postgres:phase4-ci@127.0.0.1:5432/vigil_management
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r services/management/requirements.txt
      - name: Generated collection is current
        run: |
          cp contracts/postman/management-plane.collection.json /tmp/management-plane.collection.json
          python scripts/generate_management_postman.py
          diff -u /tmp/management-plane.collection.json contracts/postman/management-plane.collection.json
      - name: Shared control tests
        run: >-
          python -m pytest -q -o addopts=''
          tests/management/test_saas_auth.py
          tests/management/test_saas_startup.py
          tests/management/test_contracts.py
          tests/management/test_saas_store_integration.py

  pulumi-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/phase4-saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: infra/phase4-saas/go.sum
      - run: go test ./...
      - run: go vet ./...

  localstack-shared-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: infra/phase4-saas/go.sum
      - uses: astral-sh/setup-uv@v7
      - uses: pulumi/actions@v7
        with: {pulumi-version: "3.244.0"}
      - run: ./infra/phase4-saas/localstack/qualify.sh managed
      - if: always()
        run: ./infra/phase4-saas/localstack/qualify.sh down
