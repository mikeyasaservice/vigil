openapi: 3.1.0
info:
  title: Vigil Managed Agent Runs
  version: 2.1.0
  description: Managed admission surface. Tenant identity is resolved server-side.
servers:
  - url: /
paths:
  /api/v2/agent-runs:
    get:
      operationId: listManagedAgentRuns
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Runs owned by the authenticated subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRunListResponse' }
    post:
      operationId: startManagedAgentRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedStartRequest' }
      responses:
        '202':
          description: Signed admission accepted for queue delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedStartResponse' }
        '403': { description: Membership or admission denied }
        '503': { description: Security or queue authority unavailable }
  /api/v2/agent-runs/{run_id}:
    get:
      operationId: getManagedAgentRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: Managed run status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRunResponse' }
        '404': { description: Run not found }
  /api/v2/agent-runs/{run_id}/cancel:
    post:
      operationId: cancelManagedAgentRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: Run cancelled and tenant epoch advanced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRunResponse' }
  /api/v2/agent-runs/{run_id}/approve:
    post:
      operationId: approveManagedAgentRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedApprovalRequest' }
      responses:
        '200':
          description: Approval bound to the requested execution action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRunResponse' }
        '403': { description: Requesting subject cannot approve its own action }
  /api/v2/agent-runs/{run_id}/resume:
    post:
      operationId: resumeManagedAgentRun
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '202':
          description: Original managed ownership and pinned versions are resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRunResponse' }
  /v1/claim:
    post:
      operationId: claimManagedExecution
      security: [{ mtls: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedClaimRequest' }
      responses:
        '200':
          description: Worker-bound execution identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionIdentity' }
        '403': { description: Claim denied }
        '503': { description: Workload identity or durable security state unavailable }
  /v1/authorize:
    post:
      operationId: authorizeManagedTool
      security: [{ mtls: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedAuthorizeRequest' }
      responses:
        '200':
          description: Authorized connector result in the existing ToolResult shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolResult' }
        '403': { description: Capability denied }
        '503': { description: 'Gateway, authorization state, or connector unavailable' }
  /v1/grants:
    post:
      operationId: issueManagedToolGrant
      security: [{ mtls: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedGrantRequest' }
      responses:
        '200':
          description: Signed one-call grant bound to the current worker claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolGrant' }
        '403': { description: Grant denied }
        '503': { description: Grant authority unavailable }
  /v1/status:
    post:
      operationId: updateManagedExecutionStatus
      security: [{ mtls: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedStatusRequest' }
      responses:
        '200':
          description: Durable execution status updated for the current claim
          content:
            application/json:
              schema:
                type: object
                required: [execution_id, status]
                properties:
                  execution_id: { type: string }
                  status: { type: string, enum: [running, retrying, waiting_approval, succeeded, failed] }
        '403': { description: Claim or attestation denied }
        '503': { description: Durable status authority unavailable }
  /v1/decisions:
    post:
      operationId: listManagedExecutionDecisions
      security: [{ mtls: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedDecisionsRequest' }
      responses:
        '200':
          description: Approved checkpoint decisions for the current claim
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedDecision' }
        '403': { description: Claim or attestation denied }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    mtls: { type: mutualTLS }
  parameters:
    RunId: { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ManagedStartRequest:
      type: object
      additionalProperties: false
      required: [finding_ids]
      properties:
        workflow_id: { type: string, const: triage-v1 }
        finding_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        prompt: { type: string, maxLength: 4000 }
    ManagedStartResponse:
      type: object
      required: [run_id, job_id, execution_id, tenant_id, deployment_id]
      properties:
        run_id: { type: string, format: uuid }
        job_id: { type: string }
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
    ManagedRunResponse:
      type: object
      required: [run_id, execution_id, tenant_id, deployment_id, status, workflow_id]
      properties:
        run_id: { type: string, format: uuid }
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
        status: { type: string, enum: [queued, running, waiting_approval, approved, cancelled, succeeded, failed] }
        workflow_id: { type: string, const: triage-v1 }
    ManagedRunListResponse:
      type: object
      required: [runs, count]
      properties:
        runs: { type: array, items: { $ref: '#/components/schemas/ManagedRunResponse' } }
        count: { type: integer, minimum: 0 }
    ManagedApprovalRequest:
      type: object
      additionalProperties: false
      required: [checkpoint_id, action, resource, argument_digest]
      properties:
        checkpoint_id: { type: string, minLength: 1, maxLength: 200 }
        action: { type: string, minLength: 1, maxLength: 200 }
        resource: { type: string, minLength: 1, maxLength: 500 }
        argument_digest: { type: string, minLength: 1, maxLength: 128 }
    ManagedClaimRequest:
      type: object
      additionalProperties: false
      required: [envelope]
      properties:
        envelope: { type: object }
        capabilities: { type: array, items: { type: string } }
    ManagedGrantRequest:
      type: object
      additionalProperties: false
      required: [execution_id, tenant_id, deployment_id, claim_token, attestation, tool]
      properties:
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
        worker_key_id: { type: string, deprecated: true, description: Compatibility echo; never authenticates the caller. }
        claim_token: { type: string }
        attestation: { type: string }
        tool: { type: string }
        args: { type: object }
        max_rows: { type: integer, minimum: 1 }
        timeout_ms: { type: integer, minimum: 1 }
    ManagedAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [execution_id, tenant_id, deployment_id, claim_token, attestation, tool, grant]
      properties:
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
        worker_key_id: { type: string, deprecated: true, description: Compatibility echo; never authenticates the caller. }
        claim_token: { type: string }
        attestation: { type: string }
        tool: { type: string }
        args: { type: object }
        grant: { $ref: '#/components/schemas/ToolGrant' }
        max_rows: { type: integer, minimum: 1 }
        timeout_ms: { type: integer, minimum: 1 }
    ManagedStatusRequest:
      type: object
      additionalProperties: false
      required: [execution_id, claim_token, attestation, status]
      properties:
        execution_id: { type: string }
        claim_token: { type: string, minLength: 1 }
        attestation: { type: string, minLength: 1 }
        status: { type: string, enum: [running, retrying, waiting_approval, succeeded, failed] }
        pending: { $ref: '#/components/schemas/ManagedPendingApproval' }
    ManagedPendingApproval:
      type: object
      additionalProperties: false
      required: [checkpoint_id, tool, args]
      properties:
        checkpoint_id: { type: string, minLength: 1, maxLength: 200 }
        tool: { type: string, minLength: 1, maxLength: 200 }
        args: { type: string, minLength: 2, maxLength: 100000 }
    ManagedDecisionsRequest:
      type: object
      additionalProperties: false
      required: [execution_id, claim_token, attestation]
      properties:
        execution_id: { type: string, minLength: 1 }
        claim_token: { type: string, minLength: 1 }
        attestation: { type: string, minLength: 1 }
    ManagedDecision:
      type: object
      additionalProperties: false
      required: [checkpoint_id, actor, answer, text, resolved_at]
      properties:
        checkpoint_id: { type: string }
        actor: { type: string }
        answer: { type: string, const: approve }
        text: { type: string }
        resolved_at: { type: string, format: date-time }
    ExecutionIdentity:
      type: object
      required: [execution_id, tenant_id, deployment_id, deployment_incarnation, workload_spiffe_id, workflow_id, workflow_digest, program_id, program_digest, capabilities, policy_version, revocation_epoch, issued_at, expires_at, jti, attestation]
      properties:
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
        deployment_incarnation: { type: string, format: uuid }
        workload_spiffe_id: { type: string, pattern: '^spiffe://' }
        worker_key_id: { type: string, deprecated: true }
        workflow_id: { type: string }
        workflow_digest: { type: string }
        program_id: { type: string }
        program_digest: { type: string }
        capabilities: { type: array, items: { type: string } }
        policy_version: { type: string }
        revocation_epoch: { type: integer, minimum: 0 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        jti: { type: string }
        attestation: { type: string }
    ToolGrant:
      type: object
      additionalProperties: false
      required: [grant_id, execution_id, tenant_id, deployment_id, deployment_incarnation, workflow_id, workflow_digest, program_id, program_digest, action, resource, argument_digest, policy_version, revocation_epoch, issued_at, expires_at, workload_key_id, claim_jti, max_rows, timeout_ms, signature]
      properties:
        grant_id: { type: string }
        execution_id: { type: string }
        tenant_id: { type: string }
        deployment_id: { type: string }
        deployment_incarnation: { type: string, format: uuid }
        workflow_id: { type: string }
        workflow_digest: { type: string }
        program_id: { type: string }
        program_digest: { type: string }
        action: { type: string }
        resource: { type: string }
        argument_digest: { type: string }
        approval_digest: { type: [string, 'null'] }
        policy_version: { type: string }
        revocation_epoch: { type: integer, minimum: 0 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        workload_key_id: { type: string, pattern: '^spiffe://' }
        claim_jti: { type: string }
        max_rows: { type: integer, minimum: 1 }
        timeout_ms: { type: integer, minimum: 1 }
        signature: { type: string, minLength: 32 }
    ToolResult:
      oneOf:
        - type: object
          required: [ok, rows, rowCount, capped, sourceSystem]
          properties:
            ok: { type: boolean, const: true }
            rows: { type: array, items: {} }
            rowCount: { type: integer, minimum: 0 }
            capped: { type: boolean }
            sourceSystem: { type: string }
        - type: object
          required: [ok, failure]
          properties:
            ok: { type: boolean, const: false }
            failure:
              type: object
              required: [kind]
              properties:
                kind: { type: string }
