openapi: 3.1.0
info:
  title: Vigil Management Plane API
  version: 5.0.0
  description: Durable lifecycle operations, shared-SaaS control metadata, and customer-owned BYOC enrollment and health.
servers:
  - url: https://management.invalid
paths:
  /livez:
    get:
      operationId: getManagementLiveness
      security: []
      responses:
        '200': {description: 'Process is live', content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /readyz:
    get:
      operationId: getManagementReadiness
      security: []
      responses:
        '200': {description: 'Management database is ready', content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /v1/deployments/{deployment_id}/operations:
    post:
      operationId: requestDeploymentOperation
      security: [{operatorBearer: []}]
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationRequest'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/deployments/{deployment_id}:
    get:
      operationId: getDeployment
      security: [{operatorBearer: []}]
      parameters: [{$ref: '#/components/parameters/DeploymentId'}]
      responses:
        '200': {description: 'Deployment state', content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/operations/{operation_id}:
    get:
      operationId: getOperation
      security: [{operatorBearer: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/operations/{operation_id}/approve:
    post:
      operationId: approveOperation
      security: [{operatorBearer: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OperationApproval'}}}
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/operations/{operation_id}/cancel:
    post:
      operationId: cancelOperation
      security: [{operatorBearer: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/operations/{operation_id}/claim:
    post:
      operationId: claimReconcileOperation
      security: [{reconcilerWorkload: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileClaim'}}}
      responses:
        '200': {$ref: '#/components/responses/SignedCommand'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/operations/{operation_id}/plan-ready:
    post:
      operationId: recordReconcilePlan
      security: [{reconcilerWorkload: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/RunnerId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PlanReady'}}}
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/operations/{operation_id}/complete:
    post:
      operationId: completeReconcileOperation
      security: [{reconcilerWorkload: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/RunnerId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OperationReceipt'}}}
      responses:
        '200': {description: 'Updated deployment', content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/operations/{operation_id}/fail:
    post:
      operationId: failReconcileOperation
      security: [{reconcilerWorkload: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}, {$ref: '#/components/parameters/RunnerId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OperationFailure'}}}
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/saas/tenants:
    get:
      operationId: listSaasTenantContexts
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Active tenant contexts derived from durable membership.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TenantContext'}}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/saas/tenants/{tenant_id}/route:
    post:
      operationId: createSaasRouteTicket
      security: [{customerBearer: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: 'Short-lived signed route ticket', content: {application/json: {schema: {$ref: '#/components/schemas/RouteTicket'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/saas/tenants/{tenant_id}/usage:
    get:
      operationId: getSaasTenantUsage
      security: [{customerBearer: []}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200':
          description: Tenant-scoped aggregate usage windows.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UsageWindow'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /internal/v1/saas/deployments/{deployment_id}/quota/reservations:
    post:
      operationId: reserveSaasQuota
      security: [{dataPlaneWorkload: []}]
      parameters: [{$ref: '#/components/parameters/DeploymentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuotaReservationRequest'}}}
      responses:
        '200': {description: 'Durable quota reservation', content: {application/json: {schema: {$ref: '#/components/schemas/QuotaReservation'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/saas/deployments/{deployment_id}/quota/reservations/{reservation_id}/commit:
    post:
      operationId: commitSaasQuota
      security: [{dataPlaneWorkload: []}]
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuotaCommitRequest'}}}
      responses:
        '200': {description: 'Committed aggregate usage', content: {application/json: {schema: {$ref: '#/components/schemas/QuotaReservation'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/byoc/enrollments:
    post:
      operationId: createByocEnrollment
      security: [{operatorBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BYOCEnrollmentRequest'}}}
      responses:
        '200': {description: 'One-use retry-stable enrollment material', content: {application/json: {schema: {$ref: '#/components/schemas/BYOCEnrollmentResponse'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /internal/v1/byoc/enroll:
    post:
      operationId: enrollByocConnector
      security: [{byocConnectorWorkload: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BYOCEnrollRequest'}}}
      responses:
        '200': {description: 'Durable connector binding and short-lived client certificate', content: {application/json: {schema: {$ref: '#/components/schemas/BYOCEnrollmentComplete'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/byoc/deployments/{deployment_id}/certificate/rotate:
    post:
      operationId: rotateByocConnectorCertificate
      security: [{byocConnectorWorkload: []}]
      parameters: [{$ref: '#/components/parameters/DeploymentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BYOCCertificateRotationRequest'}}}
      responses:
        '200': {description: 'Rotated short-lived client certificate', content: {application/json: {schema: {$ref: '#/components/schemas/BYOCCertificateResponse'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/v1/byoc/deployments/{deployment_id}/health:
    post:
      operationId: submitByocHealth
      security: [{byocConnectorWorkload: []}]
      parameters: [{$ref: '#/components/parameters/DeploymentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BYOCHealthEvent'}}}
      responses:
        '200': {description: 'Idempotent health acknowledgement', content: {application/json: {schema: {$ref: '#/components/schemas/BYOCHealthReceipt'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/tenants/{tenant_id}/deployments/{deployment_id}/byoc/revoke:
    post:
      operationId: revokeByocManagement
      security: [{operatorBearer: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '200': {description: 'Revoked customer connector binding', content: {application/json: {schema: {$ref: '#/components/schemas/BYOCConnector'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    operatorBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant and role claims are ignored; durable membership is authoritative.
    reconcilerWorkload:
      type: mutualTLS
      description: Hypercorn requires a trusted client certificate and the application reads its single SPIFFE URI SAN from the verified ASGI TLS extension.
    dataPlaneWorkload:
      type: mutualTLS
      description: The verified client SPIFFE URI must match the active deployment binding.
    byocConnectorWorkload:
      type: mutualTLS
      description: A verified customer connector certificate plus its locally held Ed25519 key are both required.
  parameters:
    DeploymentId: {name: deployment_id, in: path, required: true, schema: {type: string}}
    TenantId: {name: tenant_id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$'}}
    OperationId: {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReservationId: {name: reservation_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunnerId: {name: X-Vigil-Runner-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    OperationRequest:
      type: object
      additionalProperties: false
      required: [operation_kind, manifest]
      properties:
        operation_kind: {type: string, enum: [provision, configure, upgrade, rollback]}
        manifest: {$ref: '#/components/schemas/DeploymentManifest'}
    DeploymentManifest:
      title: Vigil managed DeploymentManifest
      type: object
      additionalProperties: false
      required:
      - contract_version
      - tenant_id
      - deployment_id
      - incarnation
      - generation
      - expected_generation
      - mode
      - placement
      - releases
      - isolation
      - storage
      - credentials
      - network
      - operations
      properties:
        contract_version:
          const: managed-soc/v1
        tenant_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,62}$
        deployment_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,62}$
        incarnation:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        expected_generation:
          type: integer
          minimum: 0
        mode:
          enum: [managed-dedicated, byoc]
        placement:
          type: object
          additionalProperties: false
          required:
          - adapter
          - account_binding_ref
          - region
          - network_binding_ref
          - state_binding_ref
          properties:
            adapter:
              const: aws-kubernetes
            account_binding_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            region:
              type: string
              pattern: ^[a-z]{2}-[a-z]+-[1-9][0-9]*$
            network_binding_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            state_binding_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
        releases:
          type: object
          additionalProperties: false
          required:
          - application
          - harness
          - infrastructure
          - database_schema
          - policy
          - dspy
          properties:
            application:
              $ref: '#/components/schemas/DeploymentManifest/$defs/release'
            harness:
              $ref: '#/components/schemas/DeploymentManifest/$defs/release'
            infrastructure:
              $ref: '#/components/schemas/DeploymentManifest/$defs/release'
            database_schema:
              type: string
              minLength: 1
              maxLength: 128
            policy:
              $ref: '#/components/schemas/DeploymentManifest/$defs/release'
            dspy:
              type: object
              additionalProperties: false
              required:
              - program_id
              - version
              - digest_ref
              - approval_ref
              - model_config_ref
              properties:
                program_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                version:
                  type: string
                  minLength: 1
                  maxLength: 128
                digest_ref:
                  $ref: '#/components/schemas/DeploymentManifest/$defs/approvedRef'
                approval_ref:
                  $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
                model_config_ref:
                  $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
        isolation:
          type: object
          additionalProperties: false
          required:
          - application
          - execution
          - database
          - queue_cache
          properties:
            application:
              const: dedicated-runtime
            execution:
              const: dedicated-tenant-nodes
            database:
              const: dedicated-instance
            queue_cache:
              const: dedicated-instance
        storage:
          type: object
          additionalProperties: false
          required:
          - database_ref
          - object_store_ref
          - memory_ref
          - queue_ref
          - key_ref
          - retention_policy_ref
          properties:
            database_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            object_store_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            memory_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            queue_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            key_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            retention_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
        credentials:
          type: object
          additionalProperties: false
          required:
          - integration_secret_refs
          - workload_identity_ref
          properties:
            integration_secret_refs:
              type: array
              maxItems: 64
              uniqueItems: true
              items:
                $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            workload_identity_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
        network:
          type: object
          additionalProperties: false
          required:
          - ingress_policy_ref
          - egress_policy_ref
          - management_transport
          - artifact_mirror_ref
          properties:
            ingress_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            egress_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            management_transport:
              const: outbound-mtls-https
            artifact_mirror_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
        operations:
          type: object
          additionalProperties: false
          required:
          - budget_policy_ref
          - export_policy_ref
          - backup_policy_ref
          - recovery_targets_ref
          - maintenance_policy_ref
          - support_policy_ref
          - approval_ref
          - rollback_compatibility_ref
          properties:
            budget_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            export_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            backup_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            recovery_targets_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            maintenance_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            support_policy_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            approval_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/localRef'
            rollback_compatibility_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/approvedRef'
      $defs:
        localRef:
          type: string
          pattern: ^local:[a-zA-Z0-9][a-zA-Z0-9._/-]{0,254}$
        approvedRef:
          type: string
          pattern: ^approved:sha256:[a-f0-9]{64}$
        release:
          type: object
          additionalProperties: false
          required:
          - version
          - digest_ref
          properties:
            version:
              type: string
              minLength: 1
              maxLength: 128
            digest_ref:
              $ref: '#/components/schemas/DeploymentManifest/$defs/approvedRef'
    OperationApproval:
      type: object
      additionalProperties: false
      required: [manifest_digest, plan_hash, expires_at]
      properties:
        manifest_digest: {$ref: '#/components/schemas/Sha256'}
        plan_hash: {$ref: '#/components/schemas/Sha256'}
        expires_at: {type: string, format: date-time}
    ReconcileClaim:
      type: object
      additionalProperties: false
      required: [phase, runner_id]
      properties:
        phase: {type: string, enum: [plan, apply]}
        runner_id: {type: string, minLength: 1, maxLength: 200}
    PlanReady:
      type: object
      additionalProperties: false
      required: [command_id, fencing_token, manifest_digest, plan_hash]
      properties:
        command_id: {type: string, format: uuid}
        fencing_token: {type: integer, minimum: 1}
        manifest_digest: {$ref: '#/components/schemas/Sha256'}
        plan_hash: {$ref: '#/components/schemas/Sha256'}
    OperationFailure:
      type: object
      additionalProperties: false
      required: [command_id, fencing_token, phase, error_code, error_detail]
      properties:
        command_id: {type: string, format: uuid}
        fencing_token: {type: integer, minimum: 1}
        phase: {type: string, enum: [plan, apply]}
        error_code: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,127}$'}
        error_detail: {type: string, minLength: 1, maxLength: 4000}
    OperationReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, command_id, deployment_id, tenant_id, fencing_token, manifest_digest, plan_hash, observed_generation, resource_inventory, verification_summary, completed_at, signature]
      properties:
        operation_id: {type: string, format: uuid}
        command_id: {type: string, format: uuid}
        deployment_id: {type: string}
        tenant_id: {type: string}
        fencing_token: {type: integer, minimum: 1}
        manifest_digest: {$ref: '#/components/schemas/Sha256'}
        plan_hash: {$ref: '#/components/schemas/Sha256'}
        observed_generation: {type: integer, minimum: 1}
        resource_inventory: {type: object, additionalProperties: {type: string}}
        verification_summary: {type: object, additionalProperties: {type: [string, integer, boolean]}}
        provider_update_id: {type: [string, 'null']}
        completed_at: {type: string, format: date-time}
        signature: {type: string, minLength: 32}
    SignedCommand:
      type: object
      additionalProperties: false
      required: [command, signature, manifest]
      properties:
        command: {type: object}
        signature: {type: string, minLength: 32}
        manifest: {$ref: '#/components/schemas/DeploymentManifest'}
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant_id, organization_id, display_name, roles, membership_version, deployment_id, cell_id, region]
      properties:
        tenant_id: {type: string}
        organization_id: {type: string}
        display_name: {type: string}
        roles: {type: array, items: {type: string, enum: [tenant_admin, analyst, approver, viewer]}, uniqueItems: true}
        membership_version: {type: integer, minimum: 1}
        deployment_id: {type: string}
        cell_id: {type: string}
        region: {type: string}
    RouteTicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at, tenant_id, deployment_id, cell_id]
      properties:
        ticket: {type: string, minLength: 32}
        expires_at: {type: string, format: date-time}
        tenant_id: {type: string}
        deployment_id: {type: string}
        cell_id: {type: string}
    QuotaReservationRequest:
      type: object
      additionalProperties: false
      required: [invocation_id, request_digest, dimension, amount]
      properties:
        invocation_id: {type: string, minLength: 1, maxLength: 200}
        request_digest: {$ref: '#/components/schemas/Sha256'}
        dimension: {$ref: '#/components/schemas/QuotaDimension'}
        amount: {type: integer, minimum: 1}
    QuotaCommitRequest:
      type: object
      additionalProperties: false
      required: [request_digest, actual_amount]
      properties:
        request_digest: {$ref: '#/components/schemas/Sha256'}
        actual_amount: {type: integer, minimum: 0}
    QuotaReservation:
      type: object
      additionalProperties: false
      required: [reservation_id, tenant_id, deployment_id, dimension, reserved_amount, policy_version, status, expires_at]
      properties:
        reservation_id: {type: string, format: uuid}
        tenant_id: {type: string}
        deployment_id: {type: string}
        dimension: {$ref: '#/components/schemas/QuotaDimension'}
        reserved_amount: {type: integer, minimum: 1}
        committed_amount: {type: [integer, 'null'], minimum: 0}
        policy_version: {type: integer, minimum: 1}
        status: {type: string, enum: [reserved, committed, released]}
        expires_at: {type: string, format: date-time}
    UsageWindow:
      type: object
      additionalProperties: false
      required: [tenant_id, dimension, window_started_at, reserved_amount, committed_amount, hard_limit, policy_version]
      properties:
        tenant_id: {type: string}
        dimension: {$ref: '#/components/schemas/QuotaDimension'}
        window_started_at: {type: string, format: date-time}
        reserved_amount: {type: integer, minimum: 0}
        committed_amount: {type: integer, minimum: 0}
        hard_limit: {type: integer, minimum: 1}
        policy_version: {type: integer, minimum: 1}
    BYOCEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, deployment_id, account_id, connector_spiffe_id, local_policy_digest, expires_at, idempotency_key]
      properties:
        tenant_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$'}
        deployment_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$'}
        account_id: {type: string, pattern: '^[0-9]{12}$'}
        connector_spiffe_id: {type: string, pattern: '^spiffe://[A-Za-z0-9._:/-]{3,240}$'}
        local_policy_digest: {$ref: '#/components/schemas/Sha256'}
        expires_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 1, maxLength: 200}
    BYOCEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollment_id, tenant_id, deployment_id, account_id, connector_spiffe_id, expires_at, enrollment_token]
      properties:
        enrollment_id: {type: string, format: uuid}
        tenant_id: {type: string}
        deployment_id: {type: string}
        account_id: {type: string}
        connector_spiffe_id: {type: string}
        expires_at: {type: string, format: date-time}
        enrollment_token: {type: string, minLength: 32}
    BYOCEnrollRequest:
      type: object
      additionalProperties: false
      required: [enrollment_id, enrollment_token, account_id, local_policy_digest, connector_public_key, proof_signature, certificate_signing_request]
      properties:
        enrollment_id: {type: string, format: uuid}
        enrollment_token: {type: string, minLength: 32, maxLength: 256}
        account_id: {type: string, pattern: '^[0-9]{12}$'}
        local_policy_digest: {$ref: '#/components/schemas/Sha256'}
        connector_public_key: {type: string, minLength: 40, maxLength: 128}
        proof_signature: {type: string, minLength: 40, maxLength: 256}
        certificate_signing_request: {type: string, minLength: 128, maxLength: 16384}
    BYOCConnector:
      type: object
      additionalProperties: false
      required: [tenant_id, deployment_id, account_id, connector_spiffe_id, local_policy_digest, trust_version, revocation_epoch, management_enabled, last_health_sequence]
      properties:
        tenant_id: {type: string}
        deployment_id: {type: string}
        account_id: {type: string}
        connector_spiffe_id: {type: string}
        local_policy_digest: {$ref: '#/components/schemas/Sha256'}
        trust_version: {type: integer, minimum: 1}
        revocation_epoch: {type: integer, minimum: 1}
        management_enabled: {type: boolean}
        last_health_sequence: {type: integer, minimum: 0}
        last_health_at: {type: [string, 'null'], format: date-time}
    BYOCCertificateResponse:
      type: object
      additionalProperties: false
      required: [client_certificate, ca_certificate, certificate_expires_at, certificate_serial]
      properties:
        client_certificate: {type: string}
        ca_certificate: {type: string}
        certificate_expires_at: {type: string, format: date-time}
        certificate_serial: {type: string, pattern: '^[a-f0-9]+$'}
    BYOCEnrollmentComplete:
      type: object
      additionalProperties: false
      required: [tenant_id, deployment_id, account_id, connector_spiffe_id, local_policy_digest, trust_version, revocation_epoch, management_enabled, last_health_sequence, client_certificate, ca_certificate, certificate_expires_at, certificate_serial]
      properties:
        tenant_id: {type: string}
        deployment_id: {type: string}
        account_id: {type: string}
        connector_spiffe_id: {type: string}
        local_policy_digest: {$ref: '#/components/schemas/Sha256'}
        trust_version: {type: integer, minimum: 1}
        revocation_epoch: {type: integer, minimum: 1}
        management_enabled: {type: boolean}
        last_health_sequence: {type: integer, minimum: 0}
        last_health_at: {type: [string, 'null'], format: date-time}
        client_certificate: {type: string}
        ca_certificate: {type: string}
        certificate_expires_at: {type: string, format: date-time}
        certificate_serial: {type: string, pattern: '^[a-f0-9]+$'}
    BYOCCertificateRotationRequest:
      type: object
      additionalProperties: false
      required: [certificate_signing_request]
      properties:
        certificate_signing_request: {type: string, minLength: 128, maxLength: 16384}
    BYOCHealthEvent:
      type: object
      additionalProperties: false
      required: [incarnation, sequence, event_kind, occurred_at, revocation_epoch, payload, signature]
      properties:
        incarnation: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        event_kind: {type: string, enum: [heartbeat, release, capacity, gap, revocation, dspy_evaluation]}
        occurred_at: {type: string, format: date-time}
        revocation_epoch: {type: integer, minimum: 1}
        payload:
          type: object
          additionalProperties: false
          required: [status, observed_generation]
          properties:
            status: {type: string, enum: [healthy, degraded, offline, revoked]}
            observed_generation: {type: integer, minimum: 0}
            release_digest: {anyOf: [{$ref: '#/components/schemas/Sha256'}, {type: 'null'}]}
            backlog_count: {type: integer, minimum: 0, default: 0}
            dropped_count: {type: integer, minimum: 0, default: 0}
            storage_watermark_percent: {type: integer, minimum: 0, maximum: 100, default: 0}
            dspy_evaluation:
              anyOf:
                - {$ref: '#/components/schemas/BYOCDSPyEvaluationReceipt'}
                - {type: 'null'}
        signature: {type: string, minLength: 40, maxLength: 256}
    BYOCDSPyEvaluationReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, deployment_id, evaluation_id, dataset_digest, program_digest, model_config_digest, metric_contract_digest, split_name, metrics, passed, completed_at, signature]
      properties:
        schema_version: {type: string, const: autobot.dspy.evaluation-receipt/v1}
        tenant_id: {type: string}
        deployment_id: {type: string}
        evaluation_id: {type: string, format: uuid}
        dataset_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        program_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        model_config_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        metric_contract_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        split_name: {type: string, enum: [development, holdout, safety]}
        metrics: {type: object, additionalProperties: {type: number}}
        passed: {type: boolean}
        completed_at: {type: string, format: date-time}
        signature: {type: string, minLength: 32, maxLength: 256}
    BYOCHealthReceipt:
      type: object
      additionalProperties: false
      required: [deployment_id, sequence, event_digest, duplicate]
      properties:
        deployment_id: {type: string}
        sequence: {type: integer, minimum: 1}
        event_digest: {$ref: '#/components/schemas/Sha256'}
        duplicate: {type: boolean}
    QuotaDimension:
      type: string
      enum: [api_requests, agent_runs, model_tokens, tool_calls, ingest_bytes, stored_bytes]
    Operation:
      type: object
      additionalProperties: true
      required: [operation_id, deployment_id, tenant_id, operation_kind, manifest_digest, target_generation, fencing_token, status]
      properties:
        operation_id: {type: string, format: uuid}
        deployment_id: {type: string}
        tenant_id: {type: string}
        operation_kind: {type: string}
        manifest_digest: {$ref: '#/components/schemas/Sha256'}
        target_generation: {type: integer}
        fencing_token: {type: integer}
        status: {type: string}
    Sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    Error:
      type: object
      properties: {detail: {}}
  responses:
    Operation: {description: 'Durable operation state', content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
    SignedCommand: {description: 'Signed short-lived command and exact manifest', content: {application/json: {schema: {$ref: '#/components/schemas/SignedCommand'}}}}
    Error: {description: 'Typed refusal', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
