{{- /*
The TypeScript agent worker: drains the BullMQ `agent-runs` queue and writes
the ledger. Mirrors llm-worker's shape, but runs its own Node image rather than
reusing the backend one.

It runs *alongside* llm-worker, not instead of it. ADR-0001 says the `arq:llm`
queue "disappears entirely", and it will — but only once nothing enqueues to it.
Three producers still do:
  services/api/routers/claude.py         (the `chat` cutover)
  services/daemon/agent_runner.py        (the `investigate` cutover)
  core/reporting/ai_insights_service.py  (no cutover step covers this one)
Delete llm-worker when that list is empty, not before.
*/ -}}
{{- if .Values.agentWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.agentWorker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-worker") | nindent 4 }}
spec:
  {{- if not .Values.agentWorker.autoscaling.enabled }}
  replicas: {{ .Values.agentWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "agent-worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.managedExecution.enabled }}
        checksum/managed-envoy: {{ include (print $.Template.BasePath "/managed-envoy-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.agentWorker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.managedExecution.enabled }}{{ include "vigil.fullname" . }}-agent-worker{{ else }}{{ include "vigil.serviceAccountName" . }}{{ end }}
      automountServiceAccountToken: false
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.managedExecution.enabled }}
      initContainers:
        - name: wait-agent-ledger
          image: "{{ .Values.dbInit.image.repository }}:{{ .Values.dbInit.image.tag }}"
          imagePullPolicy: {{ .Values.dbInit.image.pullPolicy | default "IfNotPresent" }}
          env:
            - { name: PGHOST, value: {{ include "vigil.postgres.host" . | quote }} }
            - { name: PGPORT, value: {{ include "vigil.postgres.port" . | quote }} }
            - { name: PGDATABASE, value: {{ include "vigil.postgres.database" . | quote }} }
            - { name: PGUSER, value: vigil_agent }
            {{- if and (not .Values.postgresql.enabled) .Values.postgresql.external.sslRequired }}
            - { name: PGSSLMODE, value: require }
            {{- end }}
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "vigil.postgres.passwordSecret" . }}, key: {{ include "vigil.postgres.passwordSecretKey" . }} } }
          command: ["/bin/sh", "-ec"]
          args: ["for i in $(seq 1 120); do psql -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM agent_events LIMIT 0' >/dev/null 2>&1 && exit 0; sleep 2; done; echo 'agent ledger unavailable' >&2; exit 1"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: agent-worker
          image: {{ include "vigil.image" (dict "context" . "component" "agentWorker") | quote }}
          imagePullPolicy: {{ include "vigil.imagePullPolicy" (dict "context" . "component" "agentWorker") }}
          {{- /* No command override: unlike llm-worker, this image's CMD is
                 already the worker (node dist/worker.js). */}}
          envFrom:
            {{- include "vigil.envFrom" . | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vigil.postgres.passwordSecret" . }}
                  key: {{ include "vigil.postgres.passwordSecretKey" . }}
            {{- /* The worker reads the discrete parts, not a DSN or a URL: a
                   $(VAR) substituted into either is not URL-encoded. */}}
            {{- if .Values.managedExecution.enabled }}
            {{- include "vigil.env" (dict "context" . "postgresUser" "vigil_agent") | nindent 12 }}
            {{- else }}
            {{- include "vigil.env" . | nindent 12 }}
            {{- end }}
            {{- include "vigil.agentRedisEnv" . | nindent 12 }}
            {{- include "vigil.caBundleEnv" . | nindent 12 }}
            {{- if .Values.managedExecution.enabled }}
            - name: VIGIL_EXECUTION_PROFILE
              value: managed
            - name: VIGIL_DEPLOYMENT_ID
              value: {{ required "managedExecution.deploymentId is required" .Values.managedExecution.deploymentId | quote }}
            - name: VIGIL_DEPLOYMENT_INCARNATION
              value: {{ required "managedExecution.deploymentIncarnation is required" .Values.managedExecution.deploymentIncarnation | quote }}
            - name: VIGIL_WORKER_SPIFFE_ID
              value: {{ printf "spiffe://%s/ns/%s/sa/%s-agent-worker" .Values.managedExecution.trustDomain .Release.Namespace (include "vigil.fullname" .) | quote }}
            - name: VIGIL_MANAGED_CAPABILITIES
              value: {{ .Values.managedExecution.capabilities | quote }}
            - name: VIGIL_MANAGED_CLAIM_URL
              value: http://127.0.0.1:15001/v1/claim
            - name: VIGIL_MANAGED_GATEWAY_URL
              value: http://127.0.0.1:15001/v1
            - name: VIGIL_REASONER_URL
              value: http://127.0.0.1:15002/v1/evaluate
            # Managed definitions, lifecycle state, pricing, memory and tools do
            # not use the backend's shared internal-token surface.
            - { name: VIGIL_PLAYBOOKS_URL, value: "" }
            - { name: VIGIL_RUNS_URL, value: "" }
            - { name: VIGIL_PRICING_URL, value: "" }
            - { name: VIGIL_TOOLS_URL, value: "" }
            - name: VIGIL_MANAGED_AUTHORITY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "managedExecution.trustSecretName is required" .Values.managedExecution.trustSecretName }}
                  key: {{ .Values.managedExecution.authorityPublicKeySecretKey }}
            - name: VIGIL_REASONER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managedExecution.trustSecretName }}
                  key: {{ .Values.managedExecution.reasonerTokenSecretKey }}
            {{- end }}
            {{- with .Values.agentWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- /* Probes only. Nothing routes here and there is no Service:
                   a queue consumer is reached through Redis, not the network. */}}
            - name: health
              containerPort: 6990
              protocol: TCP
          {{- /* Liveness asks only whether the process answers; readiness asks
                 whether Redis is reachable and the worker is running.

                 Deliberately not the same question. A worker whose Redis dropped
                 must stop being ready -- it drains nothing, and a rollout should
                 halt -- but restarting it would reconnect to the same broken
                 Redis, and restarting every replica at once against a Redis
                 already in trouble turns a blip into an outage. */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.agentWorker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with include "vigil.caBundleVolumeMount" . }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
        {{- if .Values.managedExecution.enabled }}
        - name: identity-proxy
          image: {{ .Values.managedExecution.envoy.image | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          resources:
            {{- toYaml .Values.managedExecution.envoy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: worker-envoy, mountPath: /etc/envoy, readOnly: true }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets/agent.sock, readOnly: true }
        {{- end }}
      {{- if or .Values.managedExecution.enabled (include "vigil.caBundleVolume" .) }}
      volumes:
        {{- with include "vigil.caBundleVolume" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.managedExecution.enabled }}
        - name: worker-envoy
          configMap:
            name: {{ include "vigil.fullname" . }}-managed-envoy
            items: [{ key: worker.yaml, path: envoy.yaml }]
        - name: spire-agent-socket
          hostPath:
            path: {{ .Values.managedExecution.spireAgentSocketHostPath | quote }}
            type: Socket
        {{- end }}
      {{- end }}
      {{- with .Values.agentWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
