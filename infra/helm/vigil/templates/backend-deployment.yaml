apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vigil.serviceAccountName" . }}
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.managedExecution.enabled }}
      initContainers:
        - name: wait-managed-schema
          image: "{{ .Values.dbInit.image.repository }}:{{ .Values.dbInit.image.tag }}"
          imagePullPolicy: {{ .Values.dbInit.image.pullPolicy | default "IfNotPresent" }}
          env:
            - { name: PGHOST, value: {{ include "vigil.postgres.host" . | quote }} }
            - { name: PGPORT, value: {{ include "vigil.postgres.port" . | quote }} }
            - { name: PGDATABASE, value: {{ include "vigil.postgres.database" . | quote }} }
            - { name: PGUSER, value: vigil_app }
            {{- if and (not .Values.postgresql.enabled) .Values.postgresql.external.sslRequired }}
            - { name: PGSSLMODE, value: require }
            {{- end }}
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "vigil.postgres.passwordSecret" . }}, key: {{ include "vigil.postgres.passwordSecretKey" . }} } }
          command: ["/bin/sh", "-ec"]
          args: ["for i in $(seq 1 120); do psql -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM managed_admissions LIMIT 0' >/dev/null 2>&1 && exit 0; sleep 2; done; echo 'managed schema unavailable' >&2; exit 1"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "vigil.image" (dict "context" . "component" "backend") | quote }}
          imagePullPolicy: {{ include "vigil.imagePullPolicy" (dict "context" . "component" "backend") }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          envFrom:
            {{- include "vigil.envFrom" . | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vigil.postgres.passwordSecret" . }}
                  key: {{ include "vigil.postgres.passwordSecretKey" . }}
            {{- include "vigil.env" . | nindent 12 }}
            {{- include "vigil.stateEnv" . | nindent 12 }}
            {{- include "vigil.caBundleEnv" . | nindent 12 }}
            {{- if .Values.managedExecution.enabled }}
            - name: VIGIL_EXECUTION_PROFILE
              value: managed
            - name: VIGIL_DEPLOYMENT_ID
              value: {{ required "managedExecution.deploymentId is required" .Values.managedExecution.deploymentId | quote }}
            - name: VIGIL_AUTH_ISSUER
              value: {{ required "managedExecution.authIssuer is required" .Values.managedExecution.authIssuer | quote }}
            - name: VIGIL_AUTH_AUDIENCE
              value: {{ required "managedExecution.authAudience is required" .Values.managedExecution.authAudience | quote }}
            - name: VIGIL_MANAGED_AUTHORITY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "managedExecution.trustSecretName is required" .Values.managedExecution.trustSecretName }}
                  key: {{ .Values.managedExecution.authorityPrivateKeySecretKey }}
            - name: VIGIL_MANAGED_AUTHORITY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.managedExecution.trustSecretName }}
                  key: {{ .Values.managedExecution.authorityPublicKeySecretKey }}
            {{- end }}
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Gate liveness/readiness on a slow first boot. Startup work (MCP
          # server connection retries, model-registry warmup) can push the
          # first successful /api/health past the liveness initialDelaySeconds
          # and trip a kill-restart loop before the app ever serves. While this
          # probe is in progress the kubelet suppresses liveness AND readiness;
          # once it passes, they take over. Allows up to
          # failureThreshold * periodSeconds = 300s for first serve.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Liveness stays on /api/health (200 while the process is up): Postgres
          # being down must not restart the pod.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness answers 503 while storage is degraded, so the pod leaves
          # rotation without being restarted.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "vigil.stateVolumeMount" . | nindent 12 }}
            {{- include "vigil.caBundleVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "vigil.stateVolume" . | nindent 8 }}
        {{- include "vigil.caBundleVolume" . | nindent 8 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
