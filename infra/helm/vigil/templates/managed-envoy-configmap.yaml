{{- if .Values.managedExecution.enabled }}
{{- $root := include "vigil.fullname" . -}}
{{- $ns := .Release.Namespace -}}
{{- $td := required "managedExecution.trustDomain is required" .Values.managedExecution.trustDomain -}}
{{- $worker := printf "spiffe://%s/ns/%s/sa/%s-agent-worker" $td $ns $root -}}
{{- $security := printf "spiffe://%s/ns/%s/sa/%s-security" $td $ns $root -}}
{{- $connector := printf "spiffe://%s/ns/%s/sa/%s-connector" $td $ns $root -}}
{{- $reasoner := printf "spiffe://%s/ns/%s/sa/%s-reasoner" $td $ns $root -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root }}-managed-envoy
  namespace: {{ $ns }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
data:
  worker.yaml: |
    node: { id: worker-proxy, cluster: {{ $root }} }
    static_resources:
      listeners:
        - name: security_local
          address: { socket_address: { address: 127.0.0.1, port_value: 15001 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: security_local
                    route_config:
                      name: security
                      virtual_hosts:
                        - name: security
                          domains: ["*"]
                          routes: [{ match: { prefix: "/" }, route: { cluster: security } }]
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
        - name: reasoner_local
          address: { socket_address: { address: 127.0.0.1, port_value: 15002 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: reasoner_local
                    route_config:
                      name: reasoner
                      virtual_hosts:
                        - name: reasoner
                          domains: ["*"]
                          routes: [{ match: { prefix: "/" }, route: { cluster: reasoner } }]
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
      clusters:
        - &spire_agent
          name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/spire/sockets/agent.sock } } } }] }]
        - name: security
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: security
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $root }}-security.{{ $ns }}.svc.cluster.local, port_value: {{ .Values.managedExecution.security.servicePort }} } } } }] }]
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs: [{ name: {{ $worker | quote }}, sds_config: &sds { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }] } } }]
                combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $security | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
        - name: reasoner
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment:
            cluster_name: reasoner
            endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $root }}-reasoner.{{ $ns }}.svc.cluster.local, port_value: {{ .Values.managedExecution.reasoner.servicePort }} } } } }] }]
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs: [{ name: {{ $worker | quote }}, sds_config: *sds }]
                combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $reasoner | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
  security.yaml.tmpl: |
    node: { id: security-proxy, cluster: {{ $root }} }
    static_resources:
      listeners:
        - name: worker_mtls
          address: { socket_address: { address: 0.0.0.0, port_value: {{ .Values.managedExecution.security.servicePort }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: worker_mtls
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true }
                    route_config:
                      name: app
                      request_headers_to_remove: [x-vigil-verified-spiffe-id, x-vigil-identity-proxy-token]
                      request_headers_to_add:
                        - { header: { key: x-vigil-verified-spiffe-id, value: "%DOWNSTREAM_PEER_URI_SAN%" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                        - { header: { key: x-vigil-identity-proxy-token, value: "__PROXY_TOKEN__" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                      virtual_hosts: [{ name: app, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: app } }] }]
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs: [{ name: {{ $security | quote }}, sds_config: &sds { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }] } } }]
                    combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $worker | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
        - name: connector_local
          address: { socket_address: { address: 127.0.0.1, port_value: 15003 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: connector_local
                    route_config: { name: connector, virtual_hosts: [{ name: connector, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: connector } }] }] }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
      clusters:
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment: { cluster_name: spire_agent, endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/spire/sockets/agent.sock } } } }] }] }
        - name: app
          connect_timeout: 1s
          load_assignment: { cluster_name: app, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8081 } } } }] }] }
        - name: connector
          type: STRICT_DNS
          connect_timeout: 3s
          load_assignment: { cluster_name: connector, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: {{ $root }}-connector.{{ $ns }}.svc.cluster.local, port_value: {{ .Values.managedExecution.connector.servicePort }} } } } }] }] }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs: [{ name: {{ $security | quote }}, sds_config: *sds }]
                combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $connector | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
  connector.yaml.tmpl: |
    node: { id: connector-proxy, cluster: {{ $root }} }
    static_resources:
      listeners:
        - name: gateway_mtls
          address: { socket_address: { address: 0.0.0.0, port_value: {{ .Values.managedExecution.connector.servicePort }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: gateway_mtls
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details: { uri: true }
                    route_config:
                      name: app
                      request_headers_to_remove: [x-vigil-verified-spiffe-id, x-vigil-identity-proxy-token]
                      request_headers_to_add:
                        - { header: { key: x-vigil-verified-spiffe-id, value: "%DOWNSTREAM_PEER_URI_SAN%" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                        - { header: { key: x-vigil-identity-proxy-token, value: "__PROXY_TOKEN__" }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                      virtual_hosts: [{ name: app, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: app } }] }]
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs: [{ name: {{ $connector | quote }}, sds_config: &sds { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }] } } }]
                    combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $security | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
      clusters:
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment: { cluster_name: spire_agent, endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/spire/sockets/agent.sock } } } }] }] }
        - name: app
          connect_timeout: 1s
          load_assignment: { cluster_name: app, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8083 } } } }] }] }
  reasoner.yaml: |
    node: { id: reasoner-proxy, cluster: {{ $root }} }
    static_resources:
      listeners:
        - name: worker_mtls
          address: { socket_address: { address: 0.0.0.0, port_value: {{ .Values.managedExecution.reasoner.servicePort }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: worker_mtls
                    route_config: { name: app, virtual_hosts: [{ name: app, domains: ["*"], routes: [{ match: { prefix: "/" }, route: { cluster: app } }] }] }
                    http_filters: [{ name: envoy.filters.http.router, typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router } }]
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs: [{ name: {{ $reasoner | quote }}, sds_config: &sds { resource_api_version: V3, api_config_source: { api_type: GRPC, transport_api_version: V3, grpc_services: [{ envoy_grpc: { cluster_name: spire_agent } }] } } }]
                    combined_validation_context: { default_validation_context: { match_typed_subject_alt_names: [{ san_type: URI, matcher: { exact: {{ $worker | quote }} } }] }, validation_context_sds_secret_config: { name: {{ printf "spiffe://%s" $td | quote }}, sds_config: *sds } }
      clusters:
        - name: spire_agent
          connect_timeout: 0.25s
          http2_protocol_options: {}
          load_assignment: { cluster_name: spire_agent, endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/spire/sockets/agent.sock } } } }] }] }
        - name: app
          connect_timeout: 1s
          load_assignment: { cluster_name: app, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8082 } } } }] }] }
{{- end }}
