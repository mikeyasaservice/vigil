{{- if .Values.managedExecution.enabled }}
{{- $root := include "vigil.fullname" . -}}
{{- range $component := list "agent-worker" "security" "connector" "reasoner" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $root $component | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
