name: vigil-phase3-localstack

services:
  management-db:
    image: postgres:16-alpine
    container_name: vigil-phase3-management-db
    ports:
      - "127.0.0.1:${PHASE3_MANAGEMENT_DB_PORT:-55439}:5432"
    environment:
      POSTGRES_DB: vigil_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: phase3-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigil_management"]
      interval: 2s
      timeout: 2s
      retries: 45

  tenant-a:
    image: localstack/localstack:4.8.1
    container_name: vigil-phase3-localstack-a
    ports:
      - "127.0.0.1:${PHASE3_LOCALSTACK_A_PORT:-4566}:4566"
    environment:
      SERVICES: ec2,kms,s3,secretsmanager,sqs,sts
      DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      LS_LOG: warn
    volumes:
      - tenant-a-state:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 45

  tenant-b:
    image: localstack/localstack:4.8.1
    container_name: vigil-phase3-localstack-b
    ports:
      - "127.0.0.1:${PHASE3_LOCALSTACK_B_PORT:-4567}:4566"
    environment:
      SERVICES: ec2,kms,s3,secretsmanager,sqs,sts
      DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      LS_LOG: warn
    volumes:
      - tenant-b-state:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 45

volumes:
  tenant-a-state:
  tenant-b-state:
